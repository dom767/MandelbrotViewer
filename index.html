<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mandelbrot Zoomer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <canvas id="fractal" aria-label="Mandelbrot set view"></canvas>
    <canvas id="tile-highlights" class="tile-highlights" aria-hidden="true"></canvas>
    <canvas id="screengrab-overlay" class="screengrab-overlay hidden" aria-hidden="true"></canvas>

    <div id="unsupported" class="banner hidden" role="alert">
      <p>WebGPU is required for this viewer. Use a recent Chrome, Edge, or Firefox with WebGPU enabled, served over <code>localhost</code> or HTTPS.</p>
    </div>

    <aside id="hud" class="hud" aria-label="Controls">
      <header class="hud__header">
        <p class="eyebrow">Baffled Cat</p>
        <h1 class="hud__title">Mandelbrot</h1>
      </header>

      <label class="field">
        <span class="field__label">Algorithm</span>
        <select id="algo" class="field__control"></select>
      </label>

      <label class="field">
        <span class="field__label">Max iterations</span>
        <input id="iter" class="field__control" type="range" min="50" max="2000" step="10" value="200" />
        <span id="iter-value" class="field__value">200</span>
      </label>

      <label class="field">
        <span class="field__label">Antialiasing</span>
        <select id="aa" class="field__control">
          <option value="1">1× (none)</option>
          <option value="2">2×2</option>
          <option value="4" selected>4×4</option>
          <option value="8">8×8</option>
          <option value="16">16×16</option>
        </select>
      </label>

      <label class="field">
        <span class="field__label">Gradient</span>
        <select id="grad" class="field__control"></select>
      </label>

      <button type="button" id="colour-edit" class="hud__colour-btn">Edit colours</button>

      <label class="field">
        <span class="field__label">V axis</span>
        <select id="secondary" class="field__control"></select>
      </label>

      <label id="sfreq-field" class="field" hidden>
        <span class="field__label">Stripes <span id="sfreq-value" class="field__value">5</span></span>
        <input id="sfreq" class="field__control" type="range" min="1" max="16" step="1" value="5" title="Stripe-average frequency k in sin(k·arg z)" />
      </label>

      <label id="swin-field" class="field" hidden>
        <span class="field__label">Window <span id="swin-value" class="field__value">32</span></span>
        <input id="swin" class="field__control" type="range" min="4" max="64" step="1" value="32" title="Recent-window length for the stripe average" />
      </label>

      <label id="degain-field" class="field" hidden>
        <span class="field__label">DE gain <span id="degain-value" class="field__value">2</span></span>
        <input id="degain" class="field__control" type="range" min="0.25" max="16" step="0.25" value="2" title="DE dynamic range (higher = more exterior octaves compress into V)" />
      </label>

      <dl class="readout" aria-live="polite">
        <div>
          <dt>Center</dt>
          <dd id="readout-center">—</dd>
        </div>
        <div>
          <dt>Zoom</dt>
          <dd id="readout-zoom">—</dd>
        </div>
        <div>
          <dt>Quality</dt>
          <dd id="readout-quality">—</dd>
        </div>
        <div>
          <dt>FPS</dt>
          <dd id="readout-fps">—</dd>
        </div>
        <div>
          <dt>Time</dt>
          <dd id="readout-time">—</dd>
        </div>
      </dl>

      <p class="hud__hint">Scroll or pinch to zoom · drag to pan</p>
    </aside>

    <aside id="orbit-panel" class="orbit-panel hidden" aria-label="Iteration orbit"></aside>
    <aside id="cloud-panel" class="cloud-panel hidden" aria-label="Iteration point cloud"></aside>
    <aside id="shots-panel" class="shots-panel hidden" aria-label="Screenshots" aria-hidden="true"></aside>
    <aside id="colour-panel" class="colour-panel hidden" aria-label="Colour editor" aria-hidden="true"></aside>

    <div id="nav-scrim" class="nav-scrim hidden" aria-hidden="true"></div>

    <div
      id="render-status"
      class="render-status"
      role="status"
      aria-live="polite"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <div class="render-status__fill" aria-hidden="true"></div>
      <span class="render-status__text">—</span>
    </div>

    <nav id="app-nav" aria-label="Main">
      <button type="button" class="nav-btn" data-nav="home" aria-label="Home — reset view">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5L12 3l9 7.5" />
          <path d="M5 9.5V20h14V9.5" />
        </svg>
        <span class="nav-label">Home</span>
      </button>
      <button type="button" class="nav-btn" data-nav="settings" aria-label="Settings" aria-pressed="false">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
        <span class="nav-label">Settings</span>
      </button>
      <button type="button" class="nav-btn" data-nav="fullscreen" aria-label="Enter fullscreen" aria-pressed="false">
        <svg class="nav-icon nav-icon--fs-enter" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3" />
          <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
          <path d="M3 16v3a2 2 0 0 0 2 2h3" />
          <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
        </svg>
        <svg class="nav-icon nav-icon--fs-exit hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3v3a2 2 0 0 1-2 2H3" />
          <path d="M21 8h-3a2 2 0 0 1-2-2V3" />
          <path d="M3 16h3a2 2 0 0 1 2 2v3" />
          <path d="M16 21v-3a2 2 0 0 1 2-2h3" />
        </svg>
        <span class="nav-label">Full</span>
      </button>
      <button type="button" class="nav-btn" data-nav="shots" aria-label="Screenshots" aria-pressed="false">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
          <circle cx="12" cy="13" r="4" />
        </svg>
        <span class="nav-label">Shots</span>
      </button>
      <button type="button" class="nav-btn" data-nav="cloud" aria-label="Point cloud" aria-pressed="false">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="6" cy="14" r="1.5" fill="currentColor" stroke="none" />
          <circle cx="11" cy="8" r="1.5" fill="currentColor" stroke="none" />
          <circle cx="12" cy="15" r="1.25" fill="currentColor" stroke="none" />
          <circle cx="17" cy="11" r="1.5" fill="currentColor" stroke="none" />
          <circle cx="18" cy="17" r="1.25" fill="currentColor" stroke="none" />
          <circle cx="8" cy="19" r="1.1" fill="currentColor" stroke="none" />
        </svg>
        <span class="nav-label">Cloud</span>
      </button>
      <button type="button" class="nav-btn" data-nav="orbit" aria-label="Orbit viewer" aria-pressed="false">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="2.25" fill="currentColor" stroke="none" />
          <ellipse cx="12" cy="12" rx="9" ry="5.5" />
          <ellipse cx="12" cy="12" rx="5.5" ry="9" />
        </svg>
        <span class="nav-label">Orbit</span>
      </button>
    </nav>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
