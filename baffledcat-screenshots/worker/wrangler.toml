name = "baffledcat-screenshots"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Custom domain: shots.baffledcat.com (configure in Cloudflare dashboard)

[[d1_databases]]
binding = "DB"
database_name = "baffledcat-shots"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "baffledcat-shots"

[vars]
ALLOWED_ORIGINS = "https://baffledcat.com,https://www.baffledcat.com,http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080"
ALLOWED_APP_IDS = "mandelbrot"
PUBLIC_BASE_URL = "https://shots.baffledcat.com"
MAX_UPLOAD_BYTES = "2097152"
MAX_EDGE = "1920"
THUMB_EDGE = "256"
TICKET_TTL_SEC = "120"
# Set TURNSTILE_SITE_KEY in dashboard / secrets for clients; secret below for verify.
# DEV_BYPASS_TURNSTILE = "1"  # local only — never in production

# Secrets (wrangler secret put …):
#   TURNSTILE_SECRET
#   TICKET_HMAC_SECRET
#   ADMIN_TOKEN
